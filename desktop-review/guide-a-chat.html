<script>
(()=>{const $=id=>document.getElementById(id),history=[];$("guideStart").addEventListener("click",()=>{$("guideWelcome").hidden=true;$("guideConversation").hidden=false;current="payment";history.length=0;render()});const scenes={start:{label:"はじめに",text:"こんにちは！\nいくつか質問しますので、一緒に登録方法を確認していきましょう！",options:[["案内をはじめる","payment"]]},payment:{label:"質問 1 / 3",text:"初回の商品代金は、クレジットカードで支払う予定ですか？",options:[["はい、クレジットカードで支払いたい","company"],["いいえ、銀行振込を考えている","bankConfirm"],["まだ決まっていない","unsure"]]},bankConfirm:{label:"事前のお支払いについて",text:"郵送登録では、申請書を郵送する前に、初回の商品代金を指定口座へお振り込みいただきます。こちらの方法でよろしいですか？",options:[["はい、郵送登録で進めたい","paper"],["確認してから決めたい","unsure"]]},company:{label:"質問 2 / 3",text:"登録するのは個人ですか？ 法人ですか？",options:[["個人で登録する","device"],["法人で登録する","corporate"],["まだ決めていない","unsure"]]},device:{label:"質問 3 / 3",text:"スマホやパソコンで、メールを確認しながら入力できそうですか？",options:[["できそう！","web"],["少し不安がある","support"],["書類を見ながら進めたい","paper"]]},corporate:{label:"ご案内",text:"法人で登録する場合は、郵送登録の手順をご確認ください。",result:"paper",reason:"現在のガイドでは、法人登録は郵送での手続きと案内されています。"},paper:{label:"ご案内",text:"郵送登録の手順をご案内します！",result:"paper",reason:"申請書と初回商品代金の振込明細のコピーを郵送する方法です。"},web:{label:"ご案内",text:"WEB登録の手順をご案内します！",result:"web",reason:"メールを確認しながら必要事項を入力し、初回代金をクレジットカードで支払う方法です。"},support:{label:"ご案内",text:"迷ったら、WEB登録と郵送登録の違いを比べてみましょう！",result:"both",reason:"操作に不安がある場合は、紹介者などに確認しながら進めることもできます。"},unsure:{label:"ご案内",text:"まだ決まっていなくても大丈夫。まずは違いを見てみましょう！",result:"both",reason:"支払い方法や個人・法人の区分を確認してから選びましょう。"}};let current="start";function render(){const panel=document.querySelector(".chat-panel");panel.classList.remove("guide-question-enter");void panel.offsetWidth;panel.classList.add("guide-question-enter");const s=scenes[current],isResult=!!s.result;$("paymentCostLink").hidden=current!=="payment";$("stepLabel").textContent=s.label;$("stepCounter").textContent=isResult?"結果":current==="start"||current==="bankConfirm"?"":"全3問";$("message").textContent=s.text;$("choices").replaceChildren();$("result").replaceChildren();$("result").hidden=!isResult;$("backBtn").disabled=!history.length;if(!isResult){s.options.forEach(([label,next])=>{const b=document.createElement("button");b.className="chat-choice guide-common-choice";b.type="button";b.textContent=label;b.addEventListener("click",()=>{history.push({from:current,choice:label});current=next;render();window.scrollTo({top:Math.max(0,window.scrollY+document.querySelector(".guide-steps").getBoundingClientRect().top-24),behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"})});$("choices").append(b)})}else{const div=document.createElement("div");div.className="chat-result";const title=document.createElement("strong");title.textContent=s.result==="web"?"WEB登録をご案内します":s.result==="paper"?"郵送登録をご案内します":"まずは比較してみましょう";const p=document.createElement("p");p.textContent=s.reason;div.append(title,p);$("result").append(div);const links=s.result==="web"?[["WEB登録へ進む","https://kynkyo1102-lgtm.github.io/nina-lab/desktop-review/guide-a-web.html"]]:s.result==="paper"?[["郵送登録の流れを見る","https://kynkyo1102-lgtm.github.io/nina-lab/desktop-review/guide-a-paper.html"]]:[["登録方法を比較する","https://kynkyo1102-lgtm.github.io/nina-lab/desktop-review/guide-a-compare.html"]];links.forEach(([label,href])=>{const a=document.createElement("a");a.href=href;a.className="chat-action";a.textContent=label+" →";$("result").append(a)});const compare=document.createElement("a");compare.className="chat-secondary";compare.href="https://kynkyo1102-lgtm.github.io/nina-lab/desktop-review/guide-a-compare.html";compare.textContent="比較表も確認する";$("result").append(compare)}}$("backBtn").addEventListener("click",()=>{const h=history.pop();if(h){current=h.from;render()}});$("restartBtn").addEventListener("click",()=>{history.length=0;current="start";$("guideConversation").hidden=true;$("guideWelcome").hidden=false;render()});render()})();
</script>
