<body class="registration-guide deadline-guide">
<main class="guide-common-page deadline-page">
<h1 class="guide-common-title">締め日について</h1>
<p class="page-intro">定期購入の内容変更・停止は、手続きのタイミングによって反映される月が変わります。</p>
<section class="deadline-section guide-section" id="deadline-reflection" aria-labelledby="reflect-title">
<h2 id="reflect-title">変更・停止が反映されるタイミング</h2>
<div class="deadline-timing">
<div class="deadline-timing-row"><div class="deadline-timing-when">毎月<strong>10日まで</strong>に手続きすると</div><div class="deadline-timing-arrow" aria-hidden="true">→</div><div class="deadline-timing-result"><strong>翌月発送分</strong><span>から反映</span></div></div>
<div class="deadline-timing-row"><div class="deadline-timing-when">毎月<strong>11日以降</strong>に手続きすると</div><div class="deadline-timing-arrow" aria-hidden="true">→</div><div class="deadline-timing-result"><strong>翌々月発送分</strong><span>から反映</span></div></div>
</div>
<p class="deadline-footnote">E-Serviceまたは書面で手続きを行ってください。</p>
<details class="deadline-alert"><summary>代金引換の方の内容変更について</summary><div class="deadline-alert-body">当月分の定期購入が代引となる方で、当月10日までに内容を変更した場合、当月分より反映される場合がある。</div></details>
</section>
</main>
