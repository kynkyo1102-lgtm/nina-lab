<style>@media(min-width:1100px) and (hover:hover) and (pointer:fine){
body.registration-guide main.guide-common-page{max-width:1120px;padding:28px 32px 70px}

.procedure-guide .procedure-section{padding:20px 24px}

.procedure-guide .procedure-category{min-width:0;margin:0}

.faq-page:has(>.faq-category){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 32px;align-items:start}
.faq-page:has(>.faq-category)>:not(.faq-category){grid-column:1/-1}
.faq-page .guide-section.faq-category{margin:0 0 18px;min-width:0}
.faq-page .faq-question-list .faq-details summary{padding:11px 3px;font-size:15px}
.faq-page .faq-answer{font-size:15px}
.faq-example{max-width:480px}
.compliance-page .cg-story-hero{padding:24px 18px 36px}
.compliance-page .cg-hero-art{max-width:150px;margin:10px auto}
.compliance-page .cg-story-hero h1{font-size:32px}
.compliance-page .cg-law-intro{margin-bottom:40px;padding:24px 30px}
.compliance-page .cg-law-illustration{width:140px}
.compliance-page .cg-story-part+.cg-story-part{margin-top:36px}
.compliance-page .cg-story-step{min-height:0;padding-bottom:36px;gap:16px;grid-template-columns:56px minmax(0,1fr)}
.compliance-page .cg-story-marker span{width:48px;height:48px;font-size:18px}
.compliance-page .cg-story-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 24px;align-items:center}
.compliance-page .cg-story-body>.cg-story-kicker,.compliance-page .cg-story-body>h3{grid-column:1/-1;margin:0}
.compliance-page .cg-story-body h3{font-size:23px}
.compliance-page .cg-story-body>.cg-story-visual{grid-column:1;margin:0;max-width:360px}
.compliance-page .cg-story-body>p{grid-column:2;margin:0;font-size:16px;line-height:1.9}

.salon-guide-page>h1,.salon-guide-page>.salon-intro-row{grid-column:1/-1;margin:0}
.salon-guide-page>.salon-map-section{grid-column:1;margin:0;min-width:0}
.salon-guide-page>.salon-finder{grid-column:2;min-width:0;padding:18px}
.salon-guide-page .salon-map-next{display:none}

<body class="registration-guide salon-guide">
<main class="guide-common-page salon-guide-page">
<h1 class="guide-common-title">全国のサロンを探す</h1>
<div class="salon-intro-row"><p class="salon-intro">都道府県を選ぶと、その地域のサロンを探せます。</p><img class="salon-intro-mito" src="./assets/mitochondria/13_magnifying-glass.svg" alt="虫眼鏡を持ったミトコンドリアちゃん" width="96" height="88"></div>
<section class="salon-map-section" aria-label="全国のサロン分布"><h2>全国のサロン分布</h2><div class="salon-stats" aria-label="掲載サロン数"><div class="salon-stat"><strong id="salon-total-count">—</strong><span>全国の掲載店舗</span></div><div class="salon-stat"><strong id="salon-pref-count">—</strong><span>サロンのある都道府県</span></div></div><p class="salon-map-help">青い都道府県をタップすると、その地域のサロン一覧に進めます。</p><div id="salon-map" class="salon-map" aria-label="都道府県別サロン分布図"></div><div id="salon-map-selection" class="salon-map-selection" aria-live="polite">地図の青い都道府県を選んでみてください。</div><p class="salon-map-legend"><span class="salon-legend-off"></span>なし <span class="salon-legend-one"></span>1店舗 <span class="salon-legend-two"></span>2〜3店舗 <span class="salon-legend-many"></span>4店舗以上 <span class="salon-owner-caption" aria-label="南熊本店の位置"><span class="salon-owner-caption-star" aria-hidden="true">★</span>南熊本店</span></p><p class="salon-map-next">地図で選びにくい場合は、下のメニューからも探せます。 <span aria-hidden="true">↓</span></p></section><section class="salon-finder" aria-label="サロン検索"><label class="salon-select-label" for="salon-pref-select">都道府県から探す</label>
<select id="salon-pref-select" class="salon-select"><option value="">都道府県を選んでください</option></select>
<div class="salon-results"><h2 id="selected" class="title" hidden></h2><div id="list" class="empty">都道府県を選ぶとサロン一覧が表示されます。</div></div>
</section>
</main>
