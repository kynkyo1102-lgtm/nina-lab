<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NINA LIFE</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e7;color:#34483b;font:16px system-ui,sans-serif}main{max-width:620px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px}section{background:#fffdf8;border:1px solid #e2dfd2;border-radius:24px;padding:22px;margin:18px 0;box-shadow:0 5px 15px #39452a0a}h1{font-size:29px;margin:8px 0}h2{font-size:22px}p{line-height:1.8}button{display:block;width:100%;text-align:left;background:#e8efe2;color:#34483b;border:1px solid #d1dfca;border-radius:14px;padding:16px;margin:9px 0;font:inherit;cursor:pointer}button:hover{background:#dbe8d3}button.primary{background:#426b50;color:white}small,footer{font-size:12px;line-height:1.7;color:#647366}.scene{font-size:64px;text-align:center;background:#e8eddb;border-radius:18px;padding:22px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{flex:1;min-width:90px;background:#f0f2e9;padding:12px;border-radius:12px;font-size:12px}.stats strong{display:block;font-size:20px}.bar{height:6px;background:#e2e6d9;border-radius:8px;overflow:hidden}.bar i{display:block;background:#779b70;height:100%}a{color:#426b50}details{margin:14px 0}button:focus-visible{outline:3px solid #a47740}</style><main><header><b>🌱 NINA LIFE</b><span>LAB / 0.2</span></header><section id="game" aria-live="polite"></section><footer>非公式の学習ゲームです。登場人物・出来事・確率・購入額は架空の設定です。実際の収入や成果を保証しません。<p><a href="sandbox.html">詳細な自由シミュレーション</a>　｜　<a href="#" id="restart">最初から遊ぶ</a></p></footer></main><script>
const el=document.getElementById('game'), money=n=>n.toLocaleString('ja-JP')+'円';let s;const goals=['商品を楽しみたい','少し副収入が欲しい','将来の働き方を考えたい','まだ分からない'];const chapters=['商品との出会い','初めての紹介','小さな組織','報酬の仕組み','仲間の活動','未来の選択'];function reset(){s={goal:-1,m:0,people:[],total:0,cost:0,last:0,log:'',lesson:'',hours:0};intro()}function intro(){el.innerHTML='<div class="scene">🌿 🏡</div><h1>あなたの物語が始まる。</h1><p>商品に出会ったあなた。これからどんな生活を送りたいですか？</p>'+goals.map((g,i)=>'<button data-goal="'+i+'">'+g+'</button>').join('');el.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{s.goal=Number(b.dataset.goal);show()})}function stats(){return '<div class="stats"><div>継続購入者<strong>'+s.people.length+'人</strong></div><div>今月の参考報酬<strong>'+money(s.last)+'</strong></div><div>累計参考収支<strong>'+money(s.total-s.cost)+'</strong></div></div>'}function show(){let ch=Math.min(5,Math.floor(s.m/2));if(s.m>=60){el.innerHTML='<div class="scene">🌳</div><h1>5年後のあなた</h1>'+stats()+'<p>活動時間：'+s.hours+'時間。選んだ未来はあなた自身のものです。収入だけが正解ではありません。</p><button id="again">別の未来を試す</button>';document.getElementById('again').onclick=reset;return}let story=['商品を使い始めたあなた。今月はどんな過ごし方をしますか？','友人と話す機会がありました。何を伝えますか？','紹介した人は左右のグループに分かれます。今月はどうしますか？','購入が続くとグループのポイントが積み上がります。','仲間の中には自分でも紹介を始める人がいます。','これからの生活に合わせて活動を選びましょう。'][ch];el.innerHTML='<small>第'+(ch+1)+'章　'+chapters[ch]+' ／ '+(Math.floor(s.m/12)+1)+'年目 '+(s.m%12+1)+'か月目</small><div class="bar"><i style="width:'+Math.min(100,s.m/12*100)+'%"></i></div><div class="scene">'+['🌿','☕','🌱 🌱','🪙','🤝','🌳'][ch]+'</div><h2>'+chapters[ch]+'</h2>'+ (s.m?stats():'')+(s.log?'<p><b>前月の出来事</b><br>'+s.log+'</p><p><small>'+s.lesson+'</small></p>':'')+'<p>'+story+'</p><button data-act="0">🌿 商品を楽しむ・生活を優先する</button><button data-act="1">💬 興味のある友人に商品を伝える</button><button data-act="2">📖 ビジネスの仕組みも学び、希望者に伝える</button>'+(s.m>=4?'<details><summary>組織と計算の詳細</summary>'+detail()+'</details>':'')+'<small>どの選択も正解です。行動による結果は架空のシナリオです。</small>';el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>turn(Number(b.dataset.act)))}function detail(){let l=s.people.filter(p=>p.side===0).length,r=s.people.length-l;return '左 '+l+'人 / 右 '+r+'人。仮に一人月1万P。直接紹介者の継続購入をアクティブと仮定。共通取得条件を満たす場合のベーシックコミッションのみ表示。会社の調整・税・その他報酬は未反映。'}function turn(a){let before=s.people.length;s.people=s.people.filter(()=>Math.random()<.95);let lost=before-s.people.length;let added=0,indirect=0;for(const p of [...s.people])if(p.partner&&Math.random()<.15){s.people.push({side:p.side,direct:false,partner:false});indirect++}if(a&&Math.random()<(a===1?.45:.65)){let l=s.people.filter(p=>p.side===0).length;let side=l<=s.people.length-l?0:1;s.people.push({side,direct:true,partner:Math.random()<.2});added++}let l=s.people.filter(p=>p.side===0).length,r=s.people.length-l,d=s.people.filter(p=>p.direct).length,w=Math.min(l,r)*10000;let rate=d>=2?.1:d===1?.03:0;s.last=w>=30000?Math.floor(Math.min(w,25000000)*rate):0;s.total+=s.last;s.cost+=[0,1000,3000][a];s.hours+=[0,2,5][a];s.m++;s.log=(added?'友人が自分の意思で購入を始めました。':a?'今回は新しい購入者は増えませんでした。':'今月は生活を優先しました。')+(lost?' '+lost+'人が購入を休止しました。':'')+(indirect?' 仲間の紹介で'+indirect+'人が増えました。':'');s.lesson=s.m<=2?'紹介するか、購入するかはそれぞれ本人の選択です。':s.m<=4?'紹介者の配置によって左右のグループができます。':s.m<=6?'ベーシックコミッションは少ない側が3万P以上などの条件で計算します。':s.m<=8?'直接アクティブ紹介者が1人なら3%、2人以上なら10%。共通条件も必要です。':'参考報酬はベーシックのみ。活動経費を引いた参考収支も確認しましょう。';show()}document.getElementById('restart').onclick=e=>{e.preventDefault();if(confirm('最初から遊び直しますか？'))reset()};reset();
</script></html>
