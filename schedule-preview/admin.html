<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スケジュール管理</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="css/home-base.css"><link rel="stylesheet" href="css/schedule-admin.css"></head><body class="home-page"><header><div class="header-logo">Place de Nina 南熊本店</div>スケジュール管理 / LAB</header><main><h1>スケジュール管理</h1><p>変更はこの画面内のみです。生成したJSONを events.json に貼り付けて公開してください。</p><form id="form"><fieldset><legend>基本情報</legend><label>イベント名<input id="title" required></label><label>種類<select id="type"><option>研修</option><option>イベント</option><option>セミナー</option><option>キャンペーン</option></select></label><label>主催・色<select id="organizer"><option value="jack">Jack's Academy / 青</option><option value="green">本社主催 / 緑</option><option value="salon">サロン / 黄</option><option value="mad">MAD GROUP / グレー</option><option value="campaign">キャンペーン / 紫</option></select></label></fieldset><fieldset><legend>日程</legend><label>開始日<input id="start" type="date" required></label><label>終了日（単日は空欄可）<input id="end" type="date"></label><label>開始時間（任意）<input id="startTime" type="time"></label><label>終了時間（任意）<input id="endTime" type="time"></label></fieldset><fieldset><legend>会場情報</legend><label>開催地<input id="location"></label><label>会場名（任意）<input id="venue"></label><label>住所（任意）<input id="address"></label></fieldset><fieldset><legend>参加情報</legend><label>参加費（任意）<input id="fee"></label><label>参加条件（任意）<input id="eligibility"></label></fieldset><fieldset><legend>その他</legend><label>申込期限（任意）<input id="deadline"></label><label>申込URL（任意）<input id="registrationUrl" type="url"></label><label>備考（任意）<input id="notes"></label><label>詳細資料URL（任意）<input id="documentUrl" type="url"></label></fieldset><button type="submit" id="save">追加</button><button type="button" id="cancel">入力クリア</button></form><p id="msg" role="status"></p><h2>登録済み予定</h2><div class="admin-filter"><select id="monthFilter" aria-label="年月"><option value="">すべての年月</option></select><select id="typeFilter" aria-label="種類"><option value="">すべての種類</option><option>研修</option><option>イベント</option><option>セミナー</option><option>キャンペーン</option></select></div><div id="items"></div><h2>JSON出力・取り込み</h2><textarea id="json" aria-label="JSON"></textarea><button id="download">JSONをダウンロード</button><button id="copy">JSONをコピー</button><button id="load">貼り付けたJSONを取り込む</button></main><script src="js/schedule-admin.js"></script></body></html>
