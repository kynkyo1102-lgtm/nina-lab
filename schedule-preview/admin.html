<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スケジュール管理</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="css/home-base.css"><style>body{font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #ccc;border-radius:6px;max-width:100%;box-sizing:border-box}input,select,textarea{width:100%}button{cursor:pointer;background:white;margin:4px}article{border-bottom:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}textarea{min-height:220px}#msg{color:#555}</style></head><body class="home-page"><header><div class="header-logo">Place de Nina 南熊本店</div>スケジュール管理 / LAB</header><main><h1>スケジュール管理</h1><p>変更はこの画面内のみです。生成したJSONを events.json に貼り付けて公開してください。</p><form id="form"><label>イベント名<input id="title" required></label><label>開始日<input id="start" type="date" required></label><label>終了日（単日は空欄可）<input id="end" type="date"></label><label>開催地<input id="location"></label><label>種類<select id="type"><option>研修</option><option>イベント</option><option>セミナー</option><option>キャンペーン</option></select></label><label>主催・色<select id="organizer"><option value="jack">Jack's Academy / 青</option><option value="green">クリスタル・アニバーサリー / 緑</option><option value="salon">サロン / 黄</option><option value="mad">MAD GROUP / グレー</option><option value="campaign">キャンペーン / 紫</option></select></label><button type="submit" id="save">追加</button><button type="button" id="cancel">入力クリア</button></form><p id="msg" role="status"></p><h2>登録済み予定</h2><div id="items"></div><h2>JSON出力・取り込み</h2><textarea id="json" aria-label="JSON"></textarea><button id="copy">JSONをコピー</button><button id="load">貼り付けたJSONを取り込む</button></main><script>const $=id=>document.getElementById(id);let data=[],edit=-1;const keys=['title','start','end','location','type','organizer'];function reset(){$('form').reset();edit=-1;$('save').textContent='追加'}function render(){data.sort((a,b)=>a.start.localeCompare(b.start));$('items').replaceChildren();data.forEach((e,i)=>{const a=document.createElement('article'),t=document.createElement('div');t.textContent=e.start+' ～ '+e.end+'　'+e.title+' / '+e.location+' / '+e.type;a.append(t);for(const [label,fn] of [['編集',()=>{edit=i;keys.forEach(k=>$(k).value=e[k]);$('save').textContent='更新';$('form').scrollIntoView()}],['削除',()=>{if(confirm('この予定を削除しますか？')){data.splice(i,1);reset();render()}}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)}$('items').append(a)});$('json').value=JSON.stringify(data,null,2)}$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(keys.map(k=>[k,$(k).value.trim()]));v.end=v.end||v.start;if(!v.title||v.end<v.start){$('msg').textContent='イベント名と日付を確認してください。';return}if(edit<0)data.push(v);else data[edit]=v;reset();render();$('msg').textContent='反映しました。JSONをコピーしてください。'};$('cancel').onclick=reset;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('json').value);$('msg').textContent='コピーしました。'}catch{$('json').select();$('msg').textContent='選択されたJSONを手動でコピーしてください。'}};$('load').onclick=()=>{try{const a=JSON.parse($('json').value);if(!Array.isArray(a)||!a.every(e=>keys.every(k=>typeof e[k]==='string')&&e.title&&/^\d{4}-\d{2}-\d{2}$/.test(e.start)&&/^\d{4}-\d{2}-\d{2}$/.test(e.end)&&e.start<=e.end&&['研修','イベント','セミナー','キャンペーン'].includes(e.type)&&['jack','green','salon','mad','campaign'].includes(e.organizer)))throw Error();data=a;reset();render();$('msg').textContent='取り込みました。'}catch{$('msg').textContent='JSONの形式を確認してください。'}};fetch('events.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{data=a;render()}).catch(()=>$('msg').textContent='読み込みに失敗しました。');</script></body></html>
