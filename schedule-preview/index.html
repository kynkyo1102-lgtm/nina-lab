<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベントスケジュール | Place de Nina</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="css/home-base.css"><link rel="stylesheet" href="css/home-layout.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"><style>
body.home-page{font-family:'Noto Sans JP',sans-serif;background:#fff;color:#222}.schedule main{max-width:850px;margin:auto;padding:28px 18px 48px}.schedule header{position:static}.schedule h1{font-size:24px;margin:6px 0 10px}.schedule .eyebrow{font-size:11px;letter-spacing:.16em;color:#777}.schedule .intro{color:#666;font-size:13px;line-height:1.8}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.tools select,.tools button,.nav button{font:inherit;font-size:13px;border:1px solid #ddd;background:white;color:#222;border-radius:8px;padding:10px;cursor:pointer}.tools button[aria-pressed=true]{background:#222;color:white}.month{margin:28px 0}.month h2{font-size:18px;border-bottom:1px solid #ddd;padding-bottom:10px}.event{display:flex;gap:14px;align-items:center;border-bottom:1px solid #eee;padding:16px 0}.date{width:76px;flex:none;text-align:center;background:#f5f5f5;border-radius:10px;padding:10px 4px;font-size:20px;font-weight:700}.date small{display:block;font-size:11px;color:#666;font-weight:400}.event h3{font-size:15px;margin:4px 0;line-height:1.5}.event p{font-size:12px;color:#666;margin:0}.tag{font-size:11px;color:#666}.campaign{background:#faf5e7;border:1px solid #e9d9a8;border-radius:10px;padding:12px;margin:10px 0;color:#72591d;font-size:13px}.nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ddd;border-left:1px solid #ddd}.cell{min-height:78px;border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:4px;font-size:12px;overflow-wrap:anywhere}.weekday{min-height:0;text-align:center;background:#f5f5f5}.cal-event{display:block;font-size:10px;background:#eee;border-radius:3px;margin:3px 0;padding:3px}.cal-campaign{background:#faf0d3;color:#72591d}.empty{color:#666;padding:20px 0}.schedule footer{position:static;text-align:center;color:#777;font-size:12px;padding:20px;border-top:1px solid #eee}@media(max-width:500px){.cell{min-height:65px;padding:3px}.weekday{min-height:0}.cal-event{font-size:9px}.event{gap:10px}.date{width:64px}.tools select{max-width:48%}}
</style></head><body class="home-page schedule"><header><div class="header-logo">Place de Nina 南熊本店</div><span class="eyebrow">SCHEDULE / LAB PREVIEW</span></header><main><span class="eyebrow">EVENT SCHEDULE</span><h1>イベントスケジュール</h1><p class="intro">イベント・研修・キャンペーンの開催予定をご確認いただけます。日程は変更になる場合があります。</p><div class="tools"><button id="list" aria-pressed="true">一覧</button><button id="cal" aria-pressed="false">カレンダー</button><select id="type" aria-label="イベント種類"><option value="">すべての種類</option><option>研修</option><option>イベント</option><option>サロン</option><option>キャンペーン</option></select><select id="place" aria-label="開催地"><option value="">すべての開催地</option></select><select id="status" aria-label="開催状況"><option value="future">開催予定</option><option value="all">すべての日程</option><option value="past">終了済み</option></select></div><div id="output" aria-live="polite">読み込み中…</div></main><footer>Place de Nina 南熊本店 · 試作ページ</footer><script>
const $=id=>document.getElementById(id), fmt=d=>d.replaceAll('-','/'), date=d=>new Date(d+'T00:00:00+09:00'), day=d=>new Intl.DateTimeFormat('ja-JP',{weekday:'short',timeZone:'Asia/Tokyo'}).format(date(d)), today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());let events=[],mode='list',month='2026-12';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shift(m,n){const [y,k]=m.split('-').map(Number),d=new Date(Date.UTC(y,k-1+n,1));return d.toISOString().slice(0,7)}function label(m){return Number(m.slice(0,4))+'年'+Number(m.slice(5))+'月'}function active(e,m){return e.start.slice(0,7)<=m&&e.end.slice(0,7)>=m}function filtered(){return events.filter(e=>(!$('type').value||e.type===$('type').value)&&(!$('place').value||e.location===$('place').value)&&($('status').value==='all'||($('status').value==='future'?e.end>=today:e.end<today)))}function render(){const a=filtered(),out=$('output');if(mode==='list'){let months=[];for(let m='2026-12';m<='2027-12';m=shift(m,1))if(a.some(e=>active(e,m)))months.push(m);out.innerHTML=months.map(m=>'<section class="month"><h2>'+label(m)+'</h2>'+a.filter(e=>active(e,m)).map(e=>e.type==='キャンペーン'?'<div class="campaign"><strong>'+esc(e.title)+'</strong><br>'+fmt(e.start)+' 〜 '+fmt(e.end)+'</div>':'<article class="event"><div class="date">'+Number(e.start.slice(-2))+(e.end!==e.start?'–'+Number(e.end.slice(-2)):'')+'<small>'+day(e.start)+(e.end!==e.start?'・'+day(e.end):'')+'</small></div><div><span class="tag">'+esc(e.type)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.location)+'</p></div></article>').join('')+'</section>').join('')||'<p class="empty">該当する予定はありません。</p>'}else{const [y,k]=month.split('-').map(Number),first=new Date(Date.UTC(y,k-1,1)).getUTCDay(),last=new Date(Date.UTC(y,k,0)).getUTCDate();let cells=['日','月','火','水','木','金','土'].map(x=>'<div class="cell weekday">'+x+'</div>');for(let i=0;i<first;i++)cells.push('<div class="cell"></div>');for(let d=1;d<=last;d++){const key=month+'-'+String(d).padStart(2,'0');cells.push('<div class="cell">'+d+a.filter(e=>e.start<=key&&e.end>=key).map(e=>'<span class="cal-event '+(e.type==='キャンペーン'?'cal-campaign':'')+'">'+esc(e.type==='キャンペーン'?'ポイントUP':e.title)+'</span>').join('')+'</div>')}out.innerHTML='<div class="nav"><button id="prev">‹ 前月</button><strong>'+label(month)+'</strong><button id="next">翌月 ›</button></div><div class="calendar">'+cells.join('')+'</div>'+a.filter(e=>active(e,month)).map(e=>'<p class="intro">'+fmt(e.start)+' '+esc(e.title)+' '+esc(e.location)+'</p>').join('');$('prev').onclick=()=>{month=shift(month,-1);render()};$('next').onclick=()=>{month=shift(month,1);render()}}}for(const id of ['type','place','status'])$(id).onchange=render;for(const id of ['list','cal'])$(id).onclick=()=>{mode=id;for(const x of ['list','cal'])$(x).setAttribute('aria-pressed',String(x===id));render()};fetch('events.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{events=a.sort((x,y)=>x.start.localeCompare(y.start));for(const p of [...new Set(events.map(e=>e.location).filter(Boolean))])$('place').add(new Option(p,p));render()}).catch(()=>$('output').textContent='予定を読み込めませんでした。再読み込みしてください。');
</script></body></html>
