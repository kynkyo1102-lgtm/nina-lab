<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベントスケジュール | Place de Nina</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="css/home-base.css"><link rel="stylesheet" href="css/home-layout.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"><style>
body.home-page{font-family:'Noto Sans JP',sans-serif;background:#fff;color:#222}.schedule main{max-width:850px;margin:auto;padding:28px 18px 48px}.schedule header{position:static}.schedule h1{font-size:24px;margin:6px 0 10px}.schedule .eyebrow{font-size:11px;letter-spacing:.16em;color:#777}.schedule .intro{color:#666;font-size:13px;line-height:1.8}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.tools select,.tools button,.nav button{font:inherit;font-size:13px;border:1px solid #ddd;background:white;color:#222;border-radius:8px;padding:10px;cursor:pointer}.tools button[aria-pressed=true]{background:#222;color:white}.month{margin:28px 0}.month h2{font-size:18px;border-bottom:1px solid #ddd;padding-bottom:10px}.event{display:flex;gap:14px;align-items:center;border-bottom:1px solid #eee;padding:16px 0}.date{width:76px;flex:none;text-align:center;background:#f5f5f5;border-radius:10px;padding:10px 4px;font-size:20px;font-weight:700}.date small{display:block;font-size:11px;color:#666;font-weight:400}.event h3{font-size:15px;margin:4px 0;line-height:1.5}.event p{font-size:12px;color:#666;margin:0}.tag{font-size:11px;color:#666}.campaign{background:#faf5e7;border:1px solid #e9d9a8;border-radius:10px;padding:12px;margin:10px 0;color:#72591d;font-size:13px}.nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ddd;border-left:1px solid #ddd}.cell{min-height:78px;border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:4px;font-size:12px;overflow-wrap:anywhere}.weekday{min-height:0;text-align:center;background:#f5f5f5}.cal-event{display:block;font-size:10px;background:#eee;border-radius:3px;margin:3px 0;padding:3px}.cal-campaign{background:#faf0d3;color:#72591d}.empty{color:#666;padding:20px 0}.schedule footer{position:static;text-align:center;color:#777;font-size:12px;padding:20px;border-top:1px solid #eee}@media(max-width:500px){.cell{min-height:65px;padding:3px}.weekday{min-height:0}.cal-event{font-size:9px}.event{gap:10px}.date{width:64px}.tools select{max-width:48%}}
.event{border-left:4px solid var(--event-color,#888);padding-left:10px}.event .date{background:color-mix(in srgb,var(--event-color,#888) 12%,white);color:var(--event-color,#888)}.cal-event{border-left:3px solid var(--event-color,#888);background:color-mix(in srgb,var(--event-color,#888) 12%,white)}.campaign{border-color:#d8c4eb;background:#f5effb;color:#70469b}.gcal{display:inline-block;margin-top:8px;font-size:12px;color:#333;text-decoration:underline}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#555}.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--event-color);margin-right:4px}.schedule .event{border-left:5px solid var(--event-color,#888)!important;padding-left:12px!important}.schedule .event .date{background:var(--event-color,#888)!important;color:#fff!important}.schedule .event .date small{color:#fff!important}.schedule .event .tag{color:var(--event-color,#888)!important;font-weight:700}.schedule .cal-event{background:var(--event-color,#888)!important;color:#fff!important}.schedule .campaign{border-left:5px solid #a16ac1!important}</style></head><body class="home-page schedule"><header><div class="header-logo">Place de Nina 南熊本店</div><span class="eyebrow">SCHEDULE / LAB PREVIEW</span></header><main><span class="eyebrow">EVENT SCHEDULE</span><h1>イベントスケジュール</h1><p class="intro">イベント・研修・キャンペーンの開催予定をご確認いただけます。日程は変更になる場合があります。</p><div class="tools"><button id="list" aria-pressed="true">一覧</button><button id="cal" aria-pressed="false">カレンダー</button><select id="type" aria-label="イベント種類"><option value="">すべての種類</option><option>研修</option><option>イベント</option><option>セミナー</option><option>キャンペーン</option></select><select id="place" aria-label="開催地"><option value="">すべての開催地</option></select><select id="status" aria-label="開催状況"><option value="future">開催予定</option><option value="all">すべての日程</option><option value="past">終了済み</option></select></div><div class="legend"><span style="--event-color:#3274ce">Jack's Academy</span><span style="--event-color:#31945d">本社主催</span><span style="--event-color:#b38a12">サロン</span><span style="--event-color:#858585">MAD GROUP</span><span style="--event-color:#a16ac1">キャンペーン</span></div><div id="output" aria-live="polite">読み込み中…</div></main><footer>Place de Nina 南熊本店 · 試作ページ</footer><script>
const $=id=>document.getElementById(id), fmt=d=>d.replaceAll('-','/'), date=d=>new Date(d+'T00:00:00+09:00'), day=d=>new Intl.DateTimeFormat('ja-JP',{weekday:'short',timeZone:'Asia/Tokyo'}).format(date(d)), today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());let events=[],mode='list',month=today.slice(0,7);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const colors={jack:'#3274ce',green:'#31945d',salon:'#b38a12',mad:'#858585',campaign:'#a16ac1'};const color=e=>colors[e.organizer]||'#858585';function timeLabel(e){return e.startTime||e.endTime?(e.startTime||'')+(e.endTime?'〜'+(e.start!==e.end?'翌日':'')+e.endTime:''):''}function gcal(e){const end=new Date(e.end+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+1);const q=new URLSearchParams({action:'TEMPLATE',text:e.title,dates:e.startTime&&e.endTime?e.start.replaceAll('-','')+'T'+e.startTime.replace(':','')+'00/'+e.end.replaceAll('-','')+'T'+e.endTime.replace(':','')+'00':e.start.replaceAll('-','')+'/'+end.toISOString().slice(0,10).replaceAll('-',''),ctz:'Asia/Tokyo',location:e.location,details:(timeLabel(e)?timeLabel(e)+'・':'開催時間未定・')+'日程は変更になる場合があります。'});return '<a class="gcal" target="_blank" rel="noopener noreferrer" href="https://calendar.google.com/calendar/render?'+esc(q.toString())+'">Googleカレンダーに追加</a>'}function shift(m,n){const [y,k]=m.split('-').map(Number),d=new Date(Date.UTC(y,k-1+n,1));return d.toISOString().slice(0,7)}function label(m){return Number(m.slice(0,4))+'年'+Number(m.slice(5))+'月'}function active(e,m){return e.start.slice(0,7)<=m&&e.end.slice(0,7)>=m}function filtered(){return events.filter(e=>(!$('type').value||e.type===$('type').value)&&(!$('place').value||e.location===$('place').value)&&($('status').value==='all'||($('status').value==='future'?e.end>=today:e.end<today)))}function render(){const a=filtered(),out=$('output');if(mode==='list'){let months=[];for(let m=a.length?a.reduce((v,e)=>e.start.slice(0,7)<v?e.start.slice(0,7):v,a[0].start.slice(0,7)):'2026-11',last=a.length?a.reduce((v,e)=>e.end.slice(0,7)>v?e.end.slice(0,7):v,a[0].end.slice(0,7)):'2026-11';m<=last;m=shift(m,1))if(a.some(e=>active(e,m)))months.push(m);out.innerHTML=months.map(m=>'<section class="month"><h2>'+label(m)+'</h2>'+a.filter(e=>active(e,m)).map(e=>e.type==='キャンペーン'?'<div class="campaign"><strong>'+esc(e.title)+'</strong><br>'+fmt(e.start)+' 〜 '+fmt(e.end)+'<br>'+gcal(e)+'</div>':'<article class="event" style="--event-color:'+color(e)+'"><div class="date">'+Number(e.start.slice(-2))+(e.end!==e.start?'–'+Number(e.end.slice(-2)):'')+'<small>'+day(e.start)+(e.end!==e.start?'・'+day(e.end):'')+'</small></div><div><span class="tag">'+esc(e.type)+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.location)+(timeLabel(e)?'　'+esc(timeLabel(e)):'')+'</p>'+gcal(e)+'</div></article>').join('')+'</section>').join('')||'<p class="empty">該当する予定はありません。</p>'}else{const [y,k]=month.split('-').map(Number),first=new Date(Date.UTC(y,k-1,1)).getUTCDay(),last=new Date(Date.UTC(y,k,0)).getUTCDate();let cells=['日','月','火','水','木','金','土'].map(x=>'<div class="cell weekday">'+x+'</div>');for(let i=0;i<first;i++)cells.push('<div class="cell"></div>');for(let d=1;d<=last;d++){const key=month+'-'+String(d).padStart(2,'0');cells.push('<div class="cell">'+d+a.filter(e=>e.type!=='キャンペーン'&&e.start<=key&&e.end>=key).map(e=>'<span class="cal-event '+(e.type==='キャンペーン'?'cal-campaign':'')+'" style="--event-color:'+color(e)+'">'+esc(e.type==='キャンペーン'?'ポイントUP':e.title)+'</span>').join('')+'</div>')}out.innerHTML='<div class="nav"><button id="prev">‹ 前月</button><strong>'+label(month)+'</strong><button id="next">翌月 ›</button></div>'+a.filter(e=>e.type==='キャンペーン'&&active(e,month)).map(e=>'<div class="campaign"><strong>'+esc(e.title)+'</strong>　'+fmt(e.start)+' 〜 '+fmt(e.end)+'<br>'+gcal(e)+'</div>').join('')+'<div class="calendar">'+cells.join('')+'</div>'+a.filter(e=>e.type!=='キャンペーン'&&active(e,month)).map(e=>'<p class="intro">'+fmt(e.start)+' '+esc(e.title)+' '+esc(e.location)+' '+esc(timeLabel(e))+' '+gcal(e)+'</p>').join('');$('prev').onclick=()=>{month=shift(month,-1);render()};$('next').onclick=()=>{month=shift(month,1);render()}}}for(const id of ['type','place','status'])$(id).onchange=render;for(const id of ['list','cal'])$(id).onclick=()=>{mode=id;for(const x of ['list','cal'])$(x).setAttribute('aria-pressed',String(x===id));render()};fetch('events.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{events=a.sort((x,y)=>x.start.localeCompare(y.start));for(const p of [...new Set(events.map(e=>e.location).filter(Boolean))])$('place').add(new Option(p,p));render()}).catch(()=>$('output').textContent='予定を読み込めませんでした。再読み込みしてください。');
</script></body></html>
